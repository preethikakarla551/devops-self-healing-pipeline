groups:
  - name: service-availability
    rules:
      - alert: FlaskApplicationDown
        expr: up{job="flask_app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Flask application metrics endpoint is unavailable
          description: Prometheus has been unable to scrape the Flask application for at least one minute.

      - alert: CAdvisorDown
        expr: up{job="cadvisor"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: cAdvisor metrics endpoint is unavailable
          description: Prometheus has been unable to scrape cAdvisor for at least one minute.
